[package]
name = "loom-test"
version = "0.1.0"
edition = "2024"

[features]
default = ["loom"]
loom = ["nbcache/loom"]

[dependencies]
nbcache = { path = "../", features = ["uuid", "dev"] }
loom = { version = "0.7.2" }
uuid = { version = "1.23.2", features = ["v4"] }
rand = "0.10.1"
siphasher = "1.0.3"
